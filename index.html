<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Base de Datos de Álbumes de Fotos</title>
    <style>
        body { font-family: sans-serif; background: #0b0117; color: white; padding: 20px; }
        .usuario-bloque { background: #1c0636; border: 1px solid #3c1269; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .correo-header { font-size: 18px; font-weight: bold; color: #00f0ff; margin-bottom: 15px; border-bottom: 2px solid #3c1269; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        input { background: #0b0117; border: 1px solid #3c1269; color: white; padding: 10px; width: 100%; border-radius: 4px; box-sizing: border-box; margin-bottom: 5px; }
        .fila-link { margin-bottom: 20px; padding: 10px; border: 1px solid #3c1269; border-radius: 8px; }
        .controles { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        .foto-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid #00f0ff; transition: 0.3s; }
        .foto-thumb:hover { transform: scale(1.1); }
        
        /* Estilo para el nombre solo lectura */
        .nombre-display { color: #ffcc00; font-weight: bold; margin-bottom: 5px; font-size: 15px; display: block; }
        
        .modal { display: none; position: fixed; z-index: 100; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal-contenido { background: #1c0636; padding: 25px; border-radius: 12px; text-align: center; border: 1px solid #3c1269; width: 90%; max-width: 800px; }
        .modal-contenido img { max-width: 100%; max-height: 60vh; object-fit: contain; margin-bottom: 20px; border-radius: 8px; }
        
        .bloque-nuevo { background: #2b0b4d; border: 2px dashed #00f0ff; padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        .btn-accion { cursor: pointer; border: none; padding: 10px; border-radius: 4px; color: white; }
    </style>
</head>
<body>

<div style="max-width: 800px; margin: auto;">
    <h2>🗄️ Base de Datos de Álbumes de Fotos</h2>

    <div class="bloque-nuevo">
        <h3 style="margin-top:0;">+ Agregar nuevo álbum</h3>
        <input type="email" id="new-correo" placeholder="Correo electrónico" style="margin-bottom: 10px;">
        <input type="url" id="new-link" placeholder="Pega aquí el Link del álbum">
        <button onclick="agregarDesdeFormulario()" class="btn-accion" style="background:#00c853; width:100%; font-weight:bold;">Registrar Álbum</button>
    </div>

    <div id="contenedor-bloques"></div>
</div>

<div id="modalZoom" class="modal">
    <div class="modal-contenido">
        <img id="imgZoom" src="">
        <input type="text" id="inputFoto" placeholder="Nueva URL de foto..." style="width: 100%; margin-bottom: 20px; padding: 12px;">
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button onclick="guardarFoto()" class="btn-accion" style="background:#00c853; padding:12px 30px;">Guardar Foto</button>
            <button onclick="document.getElementById('modalZoom').style.display='none'" class="btn-accion" style="background:#444; padding:12px 30px;">Cerrar</button>
        </div>
    </div>
</div>

<script>
    const urlAPI = 'https://api.sheetbest.com/sheets/6611ccee-bded-483e-b791-767bdcc2ffed';
    let idActual = "";

    async function obtenerMetadatos(url) {
        try {
            const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`);
            const json = await res.json();
            return {
                nombre: json.data.title || "Álbum sin título",
                foto: json.data.image ? json.data.image.url : "https://via.placeholder.com/150"
            };
        } catch (e) {
            return { nombre: "Álbum", foto: "https://via.placeholder.com/150" };
        }
    }

    async function cargar() {
        const res = await fetch(urlAPI);
        const data = await res.json();
        const contenedor = document.getElementById('contenedor-bloques');
        contenedor.innerHTML = '';

        const grupos = {};
        data.forEach(item => {
            if (!grupos[item.Correo]) grupos[item.Correo] = [];
            grupos[item.Correo].push(item);
        });

        Object.keys(grupos).forEach(correo => {
            const div = document.createElement('div');
            div.className = 'usuario-bloque';
            
            const enlaces = grupos[correo].map(item => `
                <div class="fila-link">
                    <span class="nombre-display">${item.Nombre || 'Sin nombre'}</span>
                    
                    <div class="controles">
                        <img src="${item.Foto}" class="foto-thumb" onclick="abrirEditor('${item.ID}', '${item.Foto}')">
                        <input value="${item.Link}" placeholder="Link del Álbum" onchange="actualizarDatosLink('${item.ID}', this.value)">
                        <button onclick="copiarLink('${item.Link}')" class="btn-accion" style="background:#f39c12;" title="Copiar">📋</button>
                        <button onclick="eliminar('${item.ID}')" class="btn-accion" style="background:red;">X</button>
                    </div>
                </div>
            `).join('');

            div.innerHTML = `
                <div class="correo-header">
                    <span> ${correo}</span>
                    <button onclick="agregarLink('${correo}')" class="btn-accion" style="background:#0088ff;">+ Nuevo Link</button>
                </div>
                ${enlaces}
            `;
            contenedor.appendChild(div);
        });
    }

    async function actualizarDatosLink(id, link) {
        await editar(id, 'Link', link);
        const meta = await obtenerMetadatos(link);
        await editar(id, 'Nombre', meta.nombre);
        await editar(id, 'Foto', meta.foto);
        cargar();
    }

    async function agregarDesdeFormulario() {
        const correo = document.getElementById('new-correo').value;
        const link = document.getElementById('new-link').value;
        if(!correo || !link) return alert("Completa correo y link");
        
        const meta = await obtenerMetadatos(link);
        await fetch(urlAPI, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ ID: "ID-" + Date.now(), Correo: correo, Nombre: meta.nombre, Link: link, Foto: meta.foto })
        });
        document.getElementById('new-correo').value = '';
        document.getElementById('new-link').value = '';
        cargar();
    }

    async function agregarLink(correo) {
        const newID = "ID-" + Date.now();
        await fetch(urlAPI, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ ID: newID, Correo: correo, Nombre: "Nuevo Álbum", Link: "", Foto: "https://via.placeholder.com/150" })
        });
        cargar();
    }

    function copiarLink(l) { navigator.clipboard.writeText(l).then(() => alert("Copiado!")); }
    function abrirEditor(id, url) { idActual = id; document.getElementById('imgZoom').src = url; document.getElementById('inputFoto').value = url; document.getElementById('modalZoom').style.display = 'flex'; }
    async function guardarFoto() { const nuevaUrl = document.getElementById('inputFoto').value; await editar(idActual, 'Foto', nuevaUrl); document.getElementById('modalZoom').style.display = 'none'; cargar(); }
    async function editar(id, col, val) { await fetch(`${urlAPI}/ID/${id}`, { method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ [col]: val }) }); }
    async function eliminar(id) { if(confirm('¿Borrar?')) { await fetch(`${urlAPI}/ID/${id}`, { method: 'DELETE' }); cargar(); } }

    cargar();
</script>
</body>
</html>
